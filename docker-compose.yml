services:
  api:
    container_name: fsre-sync-backend
    build: .
    restart: unless-stopped
    read_only: true
    env_file:
      - path: .env
        required: false
    environment:
      # Pin the DB to the bind mount regardless of DATABASE_URL in .env.
      DATABASE_URL: file:/app/data/fsre-sync-backend.db
      GOOGLE_APPLICATION_CREDENTIALS: /app/service_account_key.json
    tmpfs:
      - /tmp
    volumes:
      - ./data:/app/data
      - ./service_account_key.json:/app/service_account_key.json:ro
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - nginx-proxy

networks:
  nginx-proxy:
    external: true
