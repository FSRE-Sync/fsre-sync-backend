services:
  app:
    container_name: fsre-timetable-notify-backend
    build: .
    restart: always
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/service_account_key.json
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nginx-proxy
      - timetable_default

  db:
    container_name: fsre-timetable-notify-db
    image: mariadb:latest
    restart: always
    healthcheck:
      interval: 5s
      timeout: 5s
      retries: 10
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--su-mysql",
          "--connect",
          "--innodb_initialized",
        ]
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - ./db-data:/var/lib/mysql
    networks:
      - timetable_default

networks:
  nginx-proxy:
    external: true
  timetable_default:
    driver: bridge
