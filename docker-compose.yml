services:
  app:
    container_name: fsre-sync
    build: .
    restart: unless-stopped
    read_only: true
    env_file:
      - path: .env
        required: false
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/service_account_key.json
    volumes:
      - data:/app/data
      - ./service_account_key.json:/app/service_account_key.json:ro
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - nginx-proxy

volumes:
  data:

networks:
  nginx-proxy:
    external: true
